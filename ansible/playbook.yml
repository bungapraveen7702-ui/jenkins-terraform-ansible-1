
---
- name: Configure EC2 Web Server

  hosts: all
  become: yes

  tasks:

    - name: Wait for EC2 SSH
      wait_for_connection:
        timeout: 300

    - name: Update Ubuntu packages
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Copy website file
      copy:
        src: ../application/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: yes
